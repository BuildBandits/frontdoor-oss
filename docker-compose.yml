services:
  frontdoor:
    build: .
    expose:
      - "3001"
    volumes:
      - frontdoor-data:/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_PATH=/data/frontdoor.db
      - BASE_DOMAIN=${BASE_DOMAIN:-frontdoor.local}
      - FRONTEND_URL=${FRONTEND_URL:-https://frontdoor.local}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_REDIRECT_URI=${AZURE_REDIRECT_URI:-https://frontdoor.local/api/auth/microsoft/callback}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  frontdoor-data:
