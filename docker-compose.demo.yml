# Local demo without Microsoft Entra: docker compose -f docker-compose.demo.yml up --build
# Dev Login lets anyone pick any role and tokens are signed with a public
# fallback secret, so the port is published on 127.0.0.1 only. Never use this
# file for a real deployment, and never put it behind a reverse proxy.
name: frontdoor-demo

services:
  frontdoor:
    build:
      context: .
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - frontdoor-demo-data:/data
    environment:
      - NODE_ENV=development
      - DEV_LOGIN=true
      - PORT=3001
      - DATABASE_PATH=/data/frontdoor.db
      - AVATAR_CACHE_DIR=/data/avatar-cache
      - APP_ICON_CACHE_DIR=/data/app-icon-cache
      - BRANDING_ASSET_DIR=/data/branding
      - PLUGIN_ASSET_DIR=/data/plugins
      - BASE_DOMAIN=localhost
      - FRONTEND_URL=http://localhost:3001
      - ENTRA_GROUP_SYNC=false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  frontdoor-demo-data:
