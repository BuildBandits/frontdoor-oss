name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Check i18n dictionaries
        run: npm run check:i18n

      - name: Build frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: frontdoor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run -d --name frontdoor-ci -p 3001:3001 \
            -e JWT_SECRET=ci-smoke-test-secret-0123456789abcdef \
            -e AZURE_CLIENT_ID=00000000-0000-0000-0000-000000000000 \
            -e AZURE_CLIENT_SECRET=ci-dummy \
            -e AZURE_TENANT_ID=00000000-0000-0000-0000-000000000000 \
            -e AZURE_REDIRECT_URI=http://localhost:3001/api/auth/microsoft/callback \
            -e FRONTEND_URL=http://localhost:3001 \
            -e BASE_DOMAIN=localhost \
            frontdoor:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health; then
              curl -fsS http://localhost:3001/ | grep -q '<div id="root">'
              docker rm -f frontdoor-ci
              exit 0
            fi
            sleep 1
          done
          docker logs frontdoor-ci
          exit 1
